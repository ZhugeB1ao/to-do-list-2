<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do list 2</title>
    <link rel="stylesheet" href="./assets/style/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="todoapp">
      <!--Header-->
      <header id="header">
        <section class="hero">
          <section class="info-section">
            <h1>Todos</h1>
            <p class="info-text">
              You have <span class="info-count">0</span> tasks
            </p>
          </section>

          <section class="find-section border-box">
            <span class="material-symbols-outlined find-icon" >
                search
            </span>
            <input
              type="text"
              placeholder="Find something..."
              class="input input-find"
            />
          </section>
        </section>

        <!--Add Section-->
        <form class="add-section border-box">
          <span class="material-symbols-outlined add-icon" data-icon="add_task">
            add_task
          </span>
          <input
            type="text"
            placeholder="Reading books ..."
            class="input input-add"
          />
          <button class="button-add" type="submit">ADD</button>
        </form>
      </header>

      <!--Main-->
      <main id="main">
        <ul class="todo-list">
          <!-- Task items will be dynamically added here -->
        </ul>

        <div class="button-group">
          <button class="button-done button-link" type="button">
            <span class="button-text">
              <span class="material-symbols-outlined all-done-icon all-icons" data-icon="done_all">
                done_all
              </span>
              Mark All as Done
            </span>
          </button>

          <button class="button-clear button-link" type="button">
            <span class="button-text">
              <span class="material-symbols-outlined all-clear-icon all-icons" data-icon="clear_all">
                clear_all
              </span>
              Clear All
            </span>
          </button>
        </div>
        
      </main>
    </div>
    <script type="module" src="./script/app.js"></script>
  </body>
</html>
