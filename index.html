<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To do list 2</title>
        <link rel="stylesheet" href="./assets/style/index.css">
    </head>

    <body>
        <div id="todoapp">
            <!--Header-->
            <header id="header">
                <h1>Todos</h1>
                <!--Add Section-->
                <section class="add-section">
                    <input
                            id="input-add"
                            type="text"
                            placeholder="Reading books ..."
                            class="input input-add"
                    >
                    <button id="button-add" class="button">Add Here !!!</button>
                </section>
                <hr />
            </header>

            <!--Main-->
            <main id="main">
                <!--Find Section-->
                <section class="find-section">
                    <input
                            id="input-find"
                            type="text"
                            placeholder="Type to find something..."
                            class="input input-find"
                    >
                </section>


                <ul class="todo-list">
                    <!--Put to do items here with JavaScript-->
                    <li>
                        <div class="todo-item">
                            <p class="todo-desc">To do 1</p>
                            <input type="checkbox" id="checkbox-1" class="checkbox">
                        </div>
                    </li>
                    <li>
                        <div class="todo-item">
                            <p class="todo-desc">To do 2</p>
                            <input type="checkbox" id="checkbox-2" class="checkbox">
                        </div>
                    </li>
                    <li>
                        <div class="todo-item">
                            <p class="todo-desc">To do 3</p>
                            <input type="checkbox" id="checkbox-3" class="checkbox">
                        </div>
                    </li>
                </ul>
            </main>
        </div>
        <script src="./srcipt/core.js"></script>
    </body>
</html>
